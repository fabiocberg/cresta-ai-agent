conversationTools:
- customToolCall:
    fixedArgs: {}
    toolName: search_flights
  description: Search flights with all four confirmed fields. A new search invalidates
    the previous selection.
  name: search_flights
  parameters:
    additionalProperties: false
    properties:
      departure_date:
        description: Confirmed departure date in YYYY-MM-DD format.
        type: string
      destination:
        description: Arrival airport IATA code confirmed by the caller.
        type: string
      origin:
        description: Departure airport IATA code confirmed by the caller.
        type: string
      passengers:
        description: Confirmed number of passengers.
        type: integer
    required:
    - origin
    - destination
    - departure_date
    - passengers
    type: object
- customToolCall:
    fixedArgs: {}
    toolName: save_passenger_information
  description: Save all five passenger fields for a flight selected from the latest
    search. Return the verified passenger ID.
  name: save_passenger_information
  parameters:
    additionalProperties: false
    properties:
      date_of_birth:
        description: Passenger date of birth in YYYY-MM-DD format.
        type: string
      email:
        description: Passenger email address supplied by the caller.
        type: string
      first_name:
        description: Passenger first name supplied by the caller.
        type: string
      flight_id:
        description: Exact flight ID returned by the latest successful search.
        type: string
      last_name:
        description: Passenger last name supplied by the caller.
        type: string
      phone:
        description: Passenger phone number supplied by the caller.
        type: string
    required:
    - flight_id
    - first_name
    - last_name
    - email
    - phone
    - date_of_birth
    type: object
- customToolCall:
    fixedArgs: {}
    toolName: book_flight
  description: Book once with returned IDs and explicit caller consent. Never book
    on deferral or a human request.
  name: book_flight
  parameters:
    additionalProperties: false
    properties:
      confirmed:
        description: True only after the caller explicitly authorizes booking these
          exact details.
        type: boolean
      flight_id:
        description: Exact flight ID returned by the latest successful search.
        type: string
      passenger_id:
        description: Verified passenger ID returned by save_passenger_information.
        type: string
      seat_preference:
        description: Seat preference confirmed by the caller.
        enum:
        - window
        - aisle
        - middle
        type: string
    required:
    - passenger_id
    - flight_id
    - seat_preference
    - confirmed
    type: object
- builtinToolCall:
    fixedArgs:
      require_confirmation: false
      response: Thank you for calling Ocean Airlines. Goodbye.
    toolName: generic.hangup
  description: End a normal completed call. If a current flight is selected and passenger
    save succeeded, an explicit refusal to book now requires HangupHold instead, including
    refusal after a seat question. Human requests require HangupHuman. Use normal
    Hangup for completed bookings, API errors, or departures before passenger save.
  name: Hangup
  parameters:
    additionalProperties: false
    properties: {}
    required: []
    type: object
- builtinToolCall:
    fixedArgs:
      require_confirmation: false
      response: I understand you'd like a human. Goodbye.
    toolName: generic.hangup
  description: Use immediately when the caller asks for a human, live representative,
    person or supervisor. Stops the call without a transfer or more booking operations.
  name: HangupHuman
  parameters:
    additionalProperties: false
    properties: {}
    required: []
    type: object
- builtinToolCall:
    fixedArgs:
      require_confirmation: false
      response: I'm sorry, that route or requested flight is not supported by Ocean
        Airlines in this booking service. Thank you for calling.
    toolName: generic.hangup
  description: End immediately when a successful search has no flights, explicitly
    reports an unsupported route, or does not contain the requested specific flight.
    Do not use for API errors.
  name: HangupUnsupported
  parameters:
    additionalProperties: false
    properties: {}
    required: []
    type: object
- builtinToolCall:
    fixedArgs:
      require_confirmation: false
      response: I can offer a 30-minute courtesy fare hold. It expires 30 minutes
        from now. Thank you for calling Ocean Airlines.
    toolName: generic.hangup
  description: Use after current flight selection and successful passenger save when
    the caller defers or explicitly refuses booking now, including "I do not consent
    to booking" after a seat question. Speaks the simulated 30-minute fare hold and
    expiry, then ends without booking. A human request takes priority. Never use after
    an API error, completed booking, or before successful passenger save. A caller
    still choosing a seat while proceeding with booking needs clarification rather
    than hangup.
  name: HangupHold
  parameters:
    additionalProperties: false
    properties: {}
    required: []
    type: object
