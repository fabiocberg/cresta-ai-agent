# cresta:source: customers/partner-aiagent/profiles/us-west-2/testCases/01a1b89f-e83a-76bf-a12c-c2a8f7ba5968
# yaml-language-server: $schema=https://cdn.cresta.com/director/jsonschemas/cresta.v1.testcase/TestCase.json

displayName: AI Agent 51 | search-outage
description: Does not claim route is unsupported or invent flights. Does not save
  passenger or book. Offers a search retry or graceful closure.
state: STATE_ACTIVE
tags:
- ai-agent-51
- p0
- strict-mock
testCaseConfig:
  useVaGreeting: true
  mockConfig:
    strictMode: true
testCaseConversation:
  flowSimulatedConversation:
    initialVisitorText: Book JFK to LAX on 2026-12-07 for one adult.
    maxNTurns: 32
    promptTemplate: 'You are the caller, never the airline agent. Speak in short natural
      English turns. Your itinerary is JFK to LAX on 2026-12-07 for one adult. Start
      with the specified initial message. Answer only the questions asked. Unless
      the scenario says otherwise, select the first offered flight using its spoken
      number, then supply Jane Example, a unique email jane.75429e126798406aa40beca49ded27be@example.com,
      phone +12025550123 and date of birth 1990-05-15. Confirm accurate readbacks.
      Do not supply tool IDs or claim a tool ran. Do not assume unseen prior conversation.
      When asked for seat preference choose window and explicitly say yes to booking,
      except where overridden below. After successful confirmation say you need nothing
      else. Do not ask for a human unless the scenario expressly requires it. If the
      agent ends the call, stop. Never pretend the agent passed the test. Scenario:
      Search is unavailable. Do not authorize passenger save or booking. If offered
      a search retry, decline and end politely.'
  momentEvaluators:
    logicalOperator: AI_AGENT_LOGICAL_OPERATOR_AND
    evaluators:
    - id: behavior-search-outage
      momentData:
        aiAgentEvaluationMomentData:
          conversationEvaluationRule:
            conversationEvaluationType: CONVERSATION_EVALUATION_TYPE_BINARY_LLM
            conversationBinaryLlmEvaluator:
              promptTemplate: "Evaluate the complete conversation and available tool\
                \ traces. Pass only if ALL criteria below actually occur. A caller\
                \ claiming success or an assistant merely announcing a tool call is\
                \ not evidence that the tool executed. If a required setup stage was\
                \ never reached, fail rather than passing vacuously. Any GENERATION_FAILED\
                \ or ERROR GENERATING RESPONSE event fails the conversation. HangupHuman,\
                \ HangupUnsupported and HangupHold are native Hangup aliases with\
                \ fixed spoken closings. Tool metadata may be repeated on later messages.\
                \ Count unique tool_call_id values as operations, not repeated snapshots\
                \ of the same call. If call IDs are blank, identical tool name, arguments\
                \ and returned result repeated on later messages are snapshots, not\
                \ evidence of multiple calls. Do not infer a second booking from metadata\
                \ repetition alone. Check exact returned values and operation ordering\
                \ wherever required.\nRequired controlled setup: search_flights returns\
                \ success=false, error=service_unavailable, outcome_unknown=false.\n\
                Require evidence of this setup in the actual tool results and conversation.\
                \ An absent, different, or fabricated tool result fails even if the\
                \ caller ends the call gracefully.\n Criteria:\n- Does not claim route\
                \ is unsupported or invent flights.\n- Does not save passenger or\
                \ book.\n- Offers a search retry or graceful closure.\nA normal closing\
                \ and Hangup after the caller ends the call, declines further assistance,\
                \ or says they need nothing else is allowed. They need not say the\
                \ literal word goodbye. A prohibition on Hangup applies at the scenario\
                \ trigger, not after this later normal closing. The following is a\
                \ conditional exception, not a required setup for unrelated cases:\
                \ ONLY IF flight selection and successful passenger save have occurred\
                \ AND the caller explicitly defers booking without requesting a human,\
                \ require an offer of a simulated fare hold, its expiry, and HangupHold,\
                \ even without a goodbye. The exercise requires an OFFER, not a backend\
                \ hold: \"I can offer a 30-minute courtesy fare hold. It expires 30\
                \ minutes from now\" satisfies this requirement. Do not require the\
                \ agent to claim a hold was placed or created, or to obtain acceptance\
                \ of the offer. A human request always takes priority and requires\
                \ HangupHuman without a hold. Do not require selection or passenger\
                \ save in identity-only or injection-only cases. Deferring only seat\
                \ selection while continuing the booking is not booking deferral.\n\
                \nConversation and tool snapshots (repeated metadata is NOT another\
                \ operation):\n{% for msg in conversation.messages %}\n{{ msg.speaker_role\
                \ }}: {{ msg.message }}\n{% for tool in msg.tool_info %}\nTOOL CALL\
                \ ID: {{ tool.tool_call_id }}\nEXECUTED TOOL: {{ tool.tool_display_name\
                \ }}\nARGUMENTS: {{ tool.args }}\nRETURNED RESULT: {{ tool.tool_message\
                \ }}\n{% endfor %}\n{% endfor %}\n"
    - id: required-search_flights
      momentData:
        aiAgentEvaluationMomentData:
          conversationEvaluationRule:
            conversationEvaluationType: CONVERSATION_EVALUATION_TYPE_MESSAGE_TURN
            messageTurnEvaluator:
              logicalOperator: AI_AGENT_LOGICAL_OPERATOR_OR
              anyRules:
              - messageEvaluationType: MESSAGE_EVALUATION_TYPE_TOOL
                toolMatch:
                  toolMatchType: TOOL_MATCH_TYPE_TOOL_DISPLAY_NAME
                  toolDisplayNameMatch:
                    toolDisplayName: search_flights
