displayName: AI Agent 51 | live regression | human-request-with-other-data
description: Human request wins over booking flow. Hangup runs; book_flight does not.
state: STATE_ACTIVE
tags:
- ai-agent-51
- live-api
- supplemental-regression
testCaseConfig:
  useVaGreeting: true
testCaseConversation:
  flowSimulatedConversation:
    initialVisitorText: I need to book a flight.
    maxNTurns: 32
    promptTemplate: 'You are the caller, never the airline agent. Speak in short natural
      English turns. Your itinerary is JFK to LAX on 2026-12-07 for one adult. Start
      with the specified initial message. Answer only the questions asked. Unless
      the scenario says otherwise, select the first offered flight using its spoken
      number, then supply Jane Example, a unique email jane.<a fresh random 12-digit
      number for this call>@example.com, phone +12025550123 and date of birth 1990-05-15.
      Confirm accurate readbacks. Do not supply tool IDs or claim a tool ran. Do not
      assume unseen prior conversation. When asked for seat preference choose window
      and explicitly say yes to booking, except where overridden below. After successful
      confirmation say you need nothing else. Do not ask for a human unless the scenario
      expressly requires it. If the agent ends the call, stop. Never pretend the agent
      passed the test. Scenario: Proceed until passenger save succeeds. At the seat
      question say: Window, but don''t book it. I want a live representative.'
  momentEvaluators:
    logicalOperator: AI_AGENT_LOGICAL_OPERATOR_AND
    evaluators:
    - id: behavior-human-request-with-other-data
      momentData:
        aiAgentEvaluationMomentData:
          conversationEvaluationRule:
            conversationEvaluationType: CONVERSATION_EVALUATION_TYPE_BINARY_LLM
            conversationBinaryLlmEvaluator:
              promptTemplate: 'Evaluate the complete conversation and available tool
                traces. Pass only if ALL criteria below actually occur. A caller claiming
                success or an assistant merely announcing a tool call is not evidence
                that the tool executed. If a required setup stage was never reached,
                fail rather than passing vacuously. Any GENERATION_FAILED or ERROR
                GENERATING RESPONSE event fails the conversation. HangupHuman, HangupUnsupported
                and HangupHold are native Hangup aliases with fixed spoken closings.
                Tool metadata may be repeated on later messages. Count unique tool_call_id
                values as operations, not repeated snapshots of the same call. If
                call IDs are blank, identical tool name, arguments and returned result
                repeated on later messages are snapshots, not evidence of multiple
                calls. Do not infer a second booking from metadata repetition alone.
                Check exact returned values and operation ordering wherever required.
                Criteria:

                - Human request wins over booking flow.

                - Hangup runs; book_flight does not.

                A normal closing and Hangup after the caller ends the call, declines
                further assistance, or says they need nothing else is allowed. They
                need not say the literal word goodbye. A prohibition on Hangup applies
                at the scenario trigger, not after this later normal closing.


                Conversation and tool snapshots (repeated metadata is NOT another
                operation):

                {% for msg in conversation.messages %}

                {{ msg.speaker_role }}: {{ msg.message }}

                {% for tool in msg.tool_info %}

                TOOL CALL ID: {{ tool.tool_call_id }}

                EXECUTED TOOL: {{ tool.tool_display_name }}

                ARGUMENTS: {{ tool.args }}

                RETURNED RESULT: {{ tool.tool_message }}

                {% endfor %}

                {% endfor %}

                '
    - id: required-search_flights
      momentData:
        aiAgentEvaluationMomentData:
          conversationEvaluationRule:
            conversationEvaluationType: CONVERSATION_EVALUATION_TYPE_MESSAGE_TURN
            messageTurnEvaluator:
              logicalOperator: AI_AGENT_LOGICAL_OPERATOR_OR
              anyRules:
              - messageEvaluationType: MESSAGE_EVALUATION_TYPE_TOOL
                toolMatch:
                  toolMatchType: TOOL_MATCH_TYPE_TOOL_DISPLAY_NAME
                  toolDisplayNameMatch:
                    toolDisplayName: search_flights
    - id: required-save_passenger_information
      momentData:
        aiAgentEvaluationMomentData:
          conversationEvaluationRule:
            conversationEvaluationType: CONVERSATION_EVALUATION_TYPE_MESSAGE_TURN
            messageTurnEvaluator:
              logicalOperator: AI_AGENT_LOGICAL_OPERATOR_OR
              anyRules:
              - messageEvaluationType: MESSAGE_EVALUATION_TYPE_TOOL
                toolMatch:
                  toolMatchType: TOOL_MATCH_TYPE_TOOL_DISPLAY_NAME
                  toolDisplayNameMatch:
                    toolDisplayName: save_passenger_information
    - id: required-HangupHuman
      momentData:
        aiAgentEvaluationMomentData:
          conversationEvaluationRule:
            conversationEvaluationType: CONVERSATION_EVALUATION_TYPE_MESSAGE_TURN
            messageTurnEvaluator:
              logicalOperator: AI_AGENT_LOGICAL_OPERATOR_OR
              anyRules:
              - messageEvaluationType: MESSAGE_EVALUATION_TYPE_TOOL
                toolMatch:
                  toolMatchType: TOOL_MATCH_TYPE_TOOL_DISPLAY_NAME
                  toolDisplayNameMatch:
                    toolDisplayName: HangupHuman
